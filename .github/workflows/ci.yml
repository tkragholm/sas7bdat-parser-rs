name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test-lint:
    name: test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # PyO3 needs a Python to link the polars plugin's test binary (abi3-py312).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The pinned nightly (rust-toolchain.toml) auto-installs on the first cargo
      # invocation, together with its rustfmt/clippy components.
      - name: Show toolchain
        run: rustup show && cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The profiling binaries and the arg-parsing helpers they use are behind
      # `dev-tools`, which the default-feature pass above does not enable — without
      # this step nothing in CI type-checks them and they rot silently.
      - name: Clippy (dev-tools binaries)
        run: cargo clippy -p sas7bdat-cli --all-targets --features dev-tools -- -D warnings

      # `libR-sys` has a build script that locates a local R install and fails without
      # one, so the R binding cannot even be type-checked on a bare runner.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      # The R binding is its own crate with its own lockfile, deliberately outside
      # the workspace (see the root Cargo.toml), so none of the passes above touch
      # it. Nothing compiled it in CI and it drifted: its lockfile was still pinning
      # sas7bdat 0.3.0, and listing a serde_json the core dropped in 0.4.0, long
      # after the core reached 0.6.0. `--locked` is the point of this step as much
      # as clippy is — it fails on exactly that staleness instead of papering over
      # it by silently re-resolving.
      #
      # `working-directory` is load-bearing, not tidiness. The binding depends on
      # `sas7bdat` by *version* so that a package built with `R CMD build` can
      # resolve it from crates.io, and `src/.cargo/config.toml` redirects that back
      # to this checkout. Cargo discovers config by walking up from the working
      # directory — not from `--manifest-path` — so running this from the repo root
      # would miss the redirect and try to resolve the unpublished version from the
      # registry. `Makevars` invokes cargo from the same directory for the same reason.
      - name: Clippy (R bindings, outside the workspace)
        run: |
          for dir in crates/r-plugin/src crates/r-convert-plugin/src; do
            echo "::group::$dir"
            ( cd "$dir" && cargo clippy --locked --manifest-path rust/Cargo.toml \
                --all-targets -- -D warnings )
            echo "::endgroup::"
          done

      # The R sources are hand-maintained — NAMESPACE, the extendr wrappers and
      # man/ are all written rather than generated — so nothing else notices when
      # they drift apart. This caught `read_sas()` shipping with no man page at all.
      #
      # `--no-install` is what makes the step runnable here: a full check has to
      # compile the package, and the Rust crate's relative path dependency on the
      # workspace core does not survive being copied into a build directory. What
      # is left still checks the documentation, NAMESPACE, DESCRIPTION and Rd
      # syntax, which is the part that silently rots.
      #
      # `R CMD check` exits 0 on WARNING, so the exit code alone is not a gate —
      # the status line is. Requiring exactly `Status: OK` also fails on NOTEs,
      # which is the point: this is a ratchet, and it currently passes clean.
      - name: R package checks (docs, NAMESPACE, metadata)
        run: |
          for pkg in r-plugin:fastsas r-convert-plugin:fastsasconvert; do
            dir="crates/${pkg%%:*}"
            name="${pkg##*:}"
            echo "::group::$name"
            R CMD build "$dir"
            status=0
            _R_CHECK_CRAN_INCOMING_=false _R_CHECK_FORCE_SUGGESTS_=false \
              R CMD check --no-manual --no-install "${name}"_*.tar.gz || status=$?
            tail -n 30 "${name}.Rcheck/00check.log"
            test "$status" -eq 0
            grep -qx 'Status: OK' "${name}.Rcheck/00check.log"
            echo "::endgroup::"
          done

      - name: Test
        run: cargo test --workspace

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack,cargo-machete

      # Declared-but-unused dependencies. Cheap, and it catches exactly the kind of
      # drift that accumulated in sas7bdat-cli (arrow-array and hex sat in the
      # manifest unreferenced) — the compiler never complains about those.
      - name: Unused dependencies
        run: cargo machete

      # Every feature on its own. The default build exercises one combination, so a
      # `#[cfg(feature = ...)]` block that stopped compiling under some other
      # combination would otherwise only surface at release time. Use
      # `--feature-powerset` locally for the exhaustive version; it is ~16 builds per
      # crate and too slow to gate every PR.
      - name: Feature combinations
        run: cargo hack check -p sas7bdat -p sas7bdat-cli --each-feature --no-dev-deps

  # The only job that compiles and links the R bindings on Windows, which is a
  # different build from every other job here rather than the same one repeated.
  #
  # `Makevars` is read on Unix and `Makevars.win` on Windows, so the Windows link
  # line is never exercised elsewhere — and neither is the ABI it depends on. R on
  # Windows links with Rtools' mingw-w64, while cargo's default target on a Windows
  # host is MSVC; that mismatch shipped undetected until R-universe tried to build
  # the packages and every Windows binary failed on `undefined reference to
  # `__chkstk''. The Linux job could not have caught it, and R-universe is a poor
  # place to find out: it is a ten-minute round trip on someone else's schedule.
  #
  # Installing is most of the value, since that is where a link error surfaces, but
  # the suites run too — a static library can link and still be wrong about, say,
  # how it hands strings back — and they cost seconds next to the compile.
  #
  # One gap worth naming: this installs from the working tree, so `src/.cargo`
  # redirects the crates to this checkout. R-universe installs from a tarball, where
  # `.Rbuildignore` strips that redirect and the published crates are used instead.
  # A green run here means the packaging is sound; it does not prove the last
  # published core builds on Windows.
  r-windows:
    name: R packages (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      # Brings Rtools with it, which is what supplies mingw-w64 and make.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # Reads each DESCRIPTION and installs its Suggests as binaries — the reader's
      # suite compares against haven, and both use testthat.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: crates/r-plugin
          extra-packages: any::testthat

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: crates/r-convert-plugin
          extra-packages: any::testthat

      # Installs the pinned nightly up front so a toolchain download is not folded
      # into the first R CMD INSTALL, where its output would be buried. The GNU
      # target itself is added by Makevars.win — deliberately left to it, so that
      # line is covered by this job rather than worked around by it.
      - name: Show toolchain
        run: rustup show && cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/r-plugin/src/rust
            crates/r-convert-plugin/src/rust

      - name: Install and test
        shell: bash
        run: |
          for pkg in r-plugin:fastsas r-convert-plugin:fastsasconvert; do
            dir="crates/${pkg%%:*}"
            name="${pkg##*:}"
            echo "::group::install $name"
            R CMD INSTALL "$dir"
            echo "::endgroup::"
            echo "::group::test $name"
            ( cd "$dir/tests" && Rscript testthat.R )
            echo "::endgroup::"
          done

  # Coverage of the published library only. The plugins are exercised through their
  # Python/R test suites, and the CLI has no integration tests to measure.
  #
  # No --fail-under-lines yet: the number (~69%) is a starting point, and the gaps
  # worth closing are the error and format-variant paths, not the total. Add a
  # ratchet once it has settled, so it prevents regressions rather than demanding a
  # sprint. Note that region coverage flatters SIMD code — a chunk loop reads as
  # covered when only the wide path ran, never the remainder.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - name: Install llvm-tools
        run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Collect coverage
        run: cargo llvm-cov --no-report -p sas7bdat --features arrow,dictionary
      - name: Summary
        run: >
          cargo llvm-cov report --summary-only
          --ignore-filename-regex 'test_utils\.rs|benches/|examples/'
      - name: LCOV report
        run: >
          cargo llvm-cov report --lcov --output-path lcov.info
          --ignore-filename-regex 'test_utils\.rs|benches/|examples/'
      - uses: actions/upload-artifact@v6
        with:
          name: coverage-lcov
          path: lcov.info

  fuzz-regressions:
    name: fuzz regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # `-runs=0` is what makes this a replay: every input in the directory is executed
      # once and the process exits. Without it, a directory argument is treated as a
      # corpus to *extend* and the job fuzzes until the runner times out (and writes
      # new units into the tracked fixture directory). `-runs=0` also does not write.
      #
      # So this cannot flake and cannot turn CI red on a newly discovered bug; it fails
      # only if a fixed crash comes back. tests/fuzz_regressions.rs asserts the same
      # inputs at the library level — what this adds is AddressSanitizer, which the
      # normal test binary is not built with. Hunting for *new* bugs stays local
      # (`just fuzz`), because the seed corpus lives in the untracked repo-root
      # fixtures/ and is not available to CI.
      #
      # `dataset_open_path` replays the same .sas7bdat inputs through `Dataset::open`,
      # which reaches the fused single-pass scan that in-memory sources decline.
      # `catalog_parse` takes the .sas7bcat inputs, a different format.
      #
      # `--target` is not optional here. cargo-fuzz defaults it to the triple of its own
      # executable, not the toolchain's host, and install-action ships a musl-linked
      # binary — so the default builds for x86_64-unknown-linux-musl and fails with
      # "sanitizer is incompatible with statically linked libc". Taking the triple from
      # rustc pins it to the toolchain that actually has a sanitizer runtime, and keeps
      # working if the runner image ever changes architecture.
      - name: Replay fuzz artifacts under ASan
        run: |
          cd crates/sas7bdat
          host=$(rustc -vV | awk '/^host:/{print $2}')
          echo "building fuzz targets for $host"
          cargo fuzz run --target "$host" dataset_from_bytes tests/fixtures/fuzz -- -runs=0
          cargo fuzz run --target "$host" dataset_open_path tests/fixtures/fuzz -- -runs=0
          cargo fuzz run --target "$host" columnar_offsets tests/fixtures/fuzz -- -runs=0
          cargo fuzz run --target "$host" catalog_parse tests/fixtures/fuzz/catalog -- -runs=0

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Fails on vulnerabilities; "unmaintained" advisories stay non-fatal warnings.
      # RUSTSEC-2026-0176/0177 (pyo3 < 0.29) are ignored: the fix requires pyo3 0.29,
      # which is blocked upstream by pyo3-polars 0.27 (no 0.29-compatible release yet),
      # and we don't call the affected `PyCFunction::new_closure` API. Remove these
      # ignores once pyo3-polars supports pyo3 0.29.
      # RUSTSEC-2026-0194/0195 (quick-xml < 0.41) are ignored: quick-xml enters the
      # lockfile only through object_store, an optional polars cloud-IO dependency
      # that no workspace feature activates (`cargo tree -i quick-xml` finds no
      # path), and even object_store 0.14 still pins quick-xml ^0.40. Remove these
      # ignores once polars' object_store allows quick-xml >= 0.41.
      - name: Audit
        run: >
          cargo audit
          --ignore RUSTSEC-2026-0176
          --ignore RUSTSEC-2026-0177
          --ignore RUSTSEC-2026-0194
          --ignore RUSTSEC-2026-0195
