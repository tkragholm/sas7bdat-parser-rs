name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, for what changes without a push: new advisories for cargo audit, a new
  # R release for the CRAN checks, and runner images being retired.
  schedule:
    - cron: '17 5 * * 1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test-lint:
    name: test + lint
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: check-versions.sh compares each crate against the
      # tag of the version it claims, which a depth-1 clone cannot see.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # PyO3 needs a Python to link the polars plugin's test binary (abi3-py312).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The pinned stable (rust-toolchain.toml) auto-installs on the first cargo
      # invocation, together with its rustfmt/clippy components.
      - name: Show toolchain
        run: rustup show && cargo --version

      - uses: Swatinem/rust-cache@v2

      # Cheap, and it catches a failure that is otherwise silent: a `[patch]` whose
      # version no longer satisfies the requirement is dropped with a warning, not an
      # error, and the binding quietly builds against the last published core.
      - name: Version coupling
        run: ./scripts/check-versions.sh

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The profiling binaries and the arg-parsing helpers they use are behind
      # `dev-tools`, which the default-feature pass above does not enable. This step
      # is the only type-check of them in CI.
      - name: Clippy (dev-tools binaries)
        run: cargo clippy -p sas7bdat-cli --all-targets --features dev-tools -- -D warnings

      # `extendr-ffi` has a build script that locates a local R install and fails without
      # one, so the R binding cannot even be type-checked on a bare runner.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      # The R binding is its own crate with its own lockfile, outside the workspace
      # (see the root Cargo.toml), so none of the passes above touch it. `--locked`
      # makes the step fail on a stale lockfile instead of silently re-resolving.
      #
      # `working-directory` must be the binding's source directory. The binding
      # depends on `sas7bdat` by version so that a package built with `R CMD build`
      # can resolve it from crates.io, and `src/.cargo/config.toml` redirects that
      # back to this checkout. Cargo discovers config by walking up from the working
      # directory, not from `--manifest-path`, so running this from the repo root
      # would miss the redirect and try to resolve the unpublished version from the
      # registry. `Makevars` invokes cargo from the same directory for the same reason.
      - name: Clippy (R bindings, outside the workspace)
        run: |
          for dir in crates/r-plugin/src crates/r-convert-plugin/src; do
            echo "::group::$dir"
            ( cd "$dir" && cargo clippy --locked --manifest-path rust/Cargo.toml \
                --all-targets -- -D warnings )
            echo "::endgroup::"
          done

      # The R sources are hand-maintained: NAMESPACE, the extendr wrappers and
      # man/ are all written rather than generated, so nothing else notices when
      # they drift apart.
      #
      # `--no-install` keeps the step runnable here. A full check has to compile the
      # package, and the Rust crate's relative path dependency on the workspace core
      # does not survive being copied into a build directory. What is left still
      # checks the documentation, NAMESPACE, DESCRIPTION and Rd syntax.
      #
      # `R CMD check` exits 0 on WARNING, so the exit code alone is not a gate. The
      # step requires exactly `Status: OK`, which also fails on NOTEs.
      - name: R package checks (docs, NAMESPACE, metadata)
        run: |
          for pkg in r-plugin:fastsas r-convert-plugin:fastsasconvert; do
            dir="crates/${pkg%%:*}"
            name="${pkg##*:}"
            echo "::group::$name"
            R CMD build "$dir"
            status=0
            _R_CHECK_CRAN_INCOMING_=false _R_CHECK_FORCE_SUGGESTS_=false \
              R CMD check --no-manual --no-install "${name}"_*.tar.gz || status=$?
            tail -n 30 "${name}.Rcheck/00check.log"
            test "$status" -eq 0
            grep -qx 'Status: OK' "${name}.Rcheck/00check.log"
            echo "::endgroup::"
          done

      - name: Test
        run: cargo test --workspace

      # The scalar SIMD backend. `--no-default-features` drops fearless_simd, which
      # is the configuration a CRAN build would ship and the one the differential
      # tests in src/simd/tests.rs measure the other backends against. Cheap here
      # because it shares this job's toolchain and cache.
      - name: Clippy + test (scalar SIMD backend)
        run: |
          cargo clippy -p sas7bdat --all-targets --no-default-features -- -D warnings
          cargo test -p sas7bdat --no-default-features

      # The build a crate from crates.io and the R packages get: no -C target-cpu,
      # which the repository's .cargo/config.toml would otherwise set to x86-64-v3,
      # and fearless_simd dispatching at run time. The runner usually has AVX-512, so
      # SAS7BDAT_SIMD_LEVEL (read only with `internal-bench`) holds the dispatch to
      # the AVX2 and the SSE4.2 paths in turn, which an AVX2-only or older CPU takes.
      # The differential tests in src/simd/tests.rs then hold each against scalar.
      - name: Test (baseline build, AVX2 and SSE4.2 dispatch)
        env:
          RUSTFLAGS: ""
        run: |
          for level in avx2 sse4.2; do
            echo "::group::$level"
            SAS7BDAT_SIMD_LEVEL=$level cargo test -p sas7bdat --features internal-bench
            echo "::endgroup::"
          done

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack,cargo-machete

      # Declared-but-unused dependencies, which the compiler does not report.
      - name: Unused dependencies
        run: cargo machete

      # Every feature on its own. The default build exercises one combination, so a
      # `#[cfg(feature = ...)]` block that stopped compiling under some other
      # combination would otherwise only surface at release time. Use
      # `--feature-powerset` locally for the exhaustive version; it is ~16 builds per
      # crate and too slow to gate every PR.
      # `nightly-simd` is excluded because it gates `#![feature(portable_simd)]` and
      # cannot compile on the pinned stable at all. The `nightly-simd` job below is
      # what covers it.
      - name: Feature combinations
        run: >
          cargo hack check -p sas7bdat -p sas7bdat-cli --each-feature --no-dev-deps
          --exclude-features nightly-simd

  # The core on the platforms test-lint does not run: aarch64, where fearless_simd
  # takes its NEON path, and Windows, where the reader detects network drives and
  # paths differ. The bindings reach both only through their own suites.
  core-platforms:
    name: core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test -p sas7bdat -p sas7bdat-convert

  # The only job that compiles and links the R bindings on Windows.
  #
  # `Makevars` is read on Unix and `Makevars.win` on Windows, so the Windows link
  # line is not exercised elsewhere, and neither is the ABI it depends on. R on
  # Windows links with Rtools' mingw-w64, while cargo's default target on a Windows
  # host is MSVC. A mismatch shows up as `undefined reference to `__chkstk'` at
  # link time.
  #
  # Installing is most of the value, since that is where a link error surfaces.
  # The suites run too, because a static library can link and still be wrong about,
  # say, how it hands strings back.
  #
  # This installs from the working tree, so `src/.cargo` redirects the crates to
  # this checkout. R-universe installs from a tarball, where `.Rbuildignore` strips
  # that redirect and the published crates are used instead. A green run here shows
  # that the packaging is sound, not that the last published core builds on
  # Windows.
  r-windows:
    name: R packages (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Brings Rtools with it, which is what supplies mingw-w64 and make.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # Reads each DESCRIPTION and installs its Suggests as binaries — the reader's
      # suite compares against haven, and both use testthat.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: crates/r-plugin
          extra-packages: any::testthat

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: crates/r-convert-plugin
          extra-packages: any::testthat

      # Installs the pinned toolchain up front so a download is not folded into the
      # first R CMD INSTALL, where its output would be buried. The GNU target itself
      # is added by Makevars.win, which keeps that line covered by this job.
      - name: Show toolchain
        run: rustup show && cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/r-plugin/src/rust
            crates/r-convert-plugin/src/rust

      - name: Install and test
        shell: bash
        run: |
          for pkg in r-plugin:fastsas r-convert-plugin:fastsasconvert; do
            dir="crates/${pkg%%:*}"
            name="${pkg##*:}"
            echo "::group::install $name"
            R CMD INSTALL "$dir"
            echo "::endgroup::"
            echo "::group::test $name"
            ( cd "$dir/tests" && Rscript testthat.R )
            echo "::endgroup::"
          done

  # Installs the released tarballs on Windows.
  #
  # `r-windows` installs from the repository, where there is no `vendor.tar.xz`, so it
  # takes Makevars.win's non-vendored branch. `r-cran` takes the vendored branch but
  # on Linux. CRAN builds Windows binaries from a source tarball, so this job is the
  # only one that runs the path that ships: mingw toolchain, vendored sources,
  # `--offline`, redirected CARGO_HOME, `--jobs 2`.
  #
  # The vendored tarball is a release artefact and is not committed, so defects in
  # producing or consuming it do not show on a normal push. For example, macOS bsdtar
  # can embed AppleDouble members that its own `tar tf` hides, and they break the
  # zstd build on Linux.
  r-windows-cran:
    name: R packages (CRAN tarball, Windows)
    runs-on: windows-latest
    needs: r-cran
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: crates/r-plugin
          extra-packages: any::testthat

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: crates/r-convert-plugin
          extra-packages: any::testthat

      - name: Show toolchain
        run: rustup show && cargo --version

      - uses: actions/download-artifact@v8
        with:
          name: r-source-tarballs

      # Unpacked and installed from the directory rather than straight from the
      # tarball. Both take the identical build path, but installing the tarball builds
      # in a temporary directory that is then removed, leaving nothing to inspect —
      # and inspecting it is the point.
      - name: Install the tarball and test
        shell: bash
        run: |
          for name in fastsas fastsasconvert; do
            tarball=$(ls "${name}"_*.tar.gz)
            tar xzf "$tarball"

            test -f "${name}/src/rust/vendor.tar.xz" \
              || { echo "::error::$name tarball carries no vendor.tar.xz"; exit 1; }

            echo "::group::install $name"
            R CMD INSTALL "${name}"
            echo "::endgroup::"

            # Positive evidence that Makevars.win took its vendored branch. Grepping
            # the log for `--offline` would not do: make echoes the whole recipe, both
            # branches included, before the shell picks one. `cargo-home` exists only
            # if the vendored branch actually ran, and its presence simultaneously
            # confirms CARGO_HOME was redirected out of the user's home.
            test -d "${name}/src/rust/target/cargo-home" \
              || { echo "::error::$name built without the vendored branch"; exit 1; }
            echo "$name: vendored, offline, CARGO_HOME redirected"

            echo "::group::test $name"
            ( cd "${name}/tests" && Rscript testthat.R )
            echo "::endgroup::"
          done

  # The only job that needs a nightly toolchain, and the only one that compiles the
  # `nightly-simd` backend.
  #
  # `RUSTUP_TOOLCHAIN` rather than `cargo +nightly`: it overrides rust-toolchain.toml
  # for every tool in the job, including the ones that shell out to cargo themselves.
  #
  # Pinned to a date, like the stable channel is pinned to a version. A floating
  # `nightly` turns this job red whenever clippy grows a lint.
  #
  # The default features are left on deliberately. `nightly-simd` is documented to
  # override `simd` (see crates/sas7bdat/src/simd/mod.rs), so building with both
  # enabled checks that the precedence rule resolves to one backend rather than
  # failing to compile. `--all-features` would hit the same case.
  nightly-simd:
    name: nightly std::simd backend
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-07-27
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly
        run: rustup toolchain install nightly-2026-07-27 --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-simd
      - name: Show toolchain
        run: rustup show && cargo --version
      - name: Clippy
        run: cargo clippy -p sas7bdat --all-targets --features nightly-simd -- -D warnings
      # Runs the differential tests in src/simd/tests.rs with `portable` as the live
      # backend, so std::simd is held against the scalar reference on every kernel.
      - name: Test
        run: cargo test -p sas7bdat --features nightly-simd

  # Coverage of the published library only. The plugins are exercised through their
  # Python/R test suites, and the CLI has no integration tests to measure.
  #
  # There is no --fail-under-lines threshold. Coverage is around 69%, and the gaps
  # worth closing are the error and format-variant paths. Region coverage
  # overstates SIMD code: a chunk loop reads as covered when only the wide path
  # ran, never the remainder.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Install llvm-tools
        run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Collect coverage
        run: cargo llvm-cov --no-report -p sas7bdat --features arrow,dictionary
      - name: Summary
        run: >
          cargo llvm-cov report --summary-only
          --ignore-filename-regex 'test_utils\.rs|benches/|examples/'
      - name: LCOV report
        run: >
          cargo llvm-cov report --lcov --output-path lcov.info
          --ignore-filename-regex 'test_utils\.rs|benches/|examples/'
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info

  # The CRAN path, which no other job walks. `test-lint` checks the R packages with
  # `--no-install`, so it never compiles them; `r-windows` installs but does not
  # check. Neither builds the vendored bundle a submission actually ships.
  #
  # Three things are only verified here:
  #
  #   * `-Wl,-x -Wl,-S` in PKG_LIBS behaves under GNU ld. It has been tried on ld64
  #     only, and a linker that rejected either flag would fail the install outright.
  #   * the offline vendored build works. The prune could drop a file some crate
  #     reads, and `vendor-r-package.sh` only test-builds for the host it runs on.
  #   * installed size. fastsas stays under the 5 MB that `R CMD check` NOTEs.
  #     fastsasconvert carries arrow and parquet and is about 6.1 MB on Linux since
  #     arrow 60. Per-crate size settings do not reach arrow's generic code under
  #     fat LTO, so only size-optimising the Parquet writer itself would bring it
  #     under 5 MB. Its NOTE is answered in cran-comments.md, and a ceiling of 7 MB
  #     still catches losing the strip flags, which are worth about 4 MB.
  #
  # Not gated on `Status: OK`: both packages carry a known `_abort` WARNING from
  # Rust's std that cannot be removed while extendr needs unwinding, and it is
  # answered in each package's cran-comments.md. The job fails on any ERROR, on any
  # other WARNING, and on the specific properties below; the full log is uploaded.
  #
  # The packages are built and checked in a directory outside the checkout, as
  # CRAN builds them: inside it, the repository's .cargo/config.toml would set
  # target-cpu flags that CRAN's machines do not use.
  r-cran:
    name: R packages (CRAN checks, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: crates/r-plugin
          extra-packages: any::testthat

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: crates/r-convert-plugin
          extra-packages: any::testthat

      - name: Show toolchain
        run: rustup show && cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/r-plugin/src/rust
            crates/r-convert-plugin/src/rust

      # Needs the network, exactly as a maintainer cutting a release does. Everything
      # after it runs offline.
      - name: Vendor dependencies
        run: |
          ./scripts/vendor-r-package.sh r-plugin
          ./scripts/vendor-r-package.sh r-convert-plugin

      # `inst/AUTHORS` is generated from the vendored tree and committed. If the
      # dependency graph moved without it being regenerated, the shipped copyright
      # listing describes the wrong set of crates.
      - name: inst/AUTHORS is current
        run: |
          if ! git diff --quiet -- crates/*/inst/AUTHORS; then
            echo "::error::inst/AUTHORS is stale — run scripts/vendor-r-package.sh and commit"
            git diff -- crates/*/inst/AUTHORS
            exit 1
          fi

      - name: Build and check
        run: |
          mkdir -p "$RUNNER_TEMP/rcheck"
          cd "$RUNNER_TEMP/rcheck"
          for pkg in r-plugin:fastsas r-convert-plugin:fastsasconvert; do
            dir="$GITHUB_WORKSPACE/crates/${pkg%%:*}"
            name="${pkg##*:}"
            echo "::group::$name"
            R CMD build "$dir"
            _R_CHECK_CRAN_INCOMING_=false R CMD check --as-cran --no-manual "${name}"_*.tar.gz || true
            log="${name}.Rcheck/00check.log"
            tail -n 40 "$log"

            if grep -qE '\.\.\. ERROR|^ *ERROR$' "$log"; then
              echo "::error::$name: R CMD check reported an ERROR"; exit 1
            fi
            warnings=$(grep -c '\.\.\. WARNING' "$log" || true)
            if [ "$warnings" -gt 1 ] || { [ "$warnings" -eq 1 ] && ! grep -q 'checking compiled code \.\.\. WARNING' "$log"; }; then
              echo "::error::$name: a WARNING other than the known _abort one"; exit 1
            fi

            if [ "$name" = fastsasconvert ]; then
              size=$(sed -n 's/^ *installed size is *\([0-9.]*\)Mb.*/\1/p' "$log")
              if [ -n "$size" ] && awk -v s="$size" 'BEGIN { exit !(s > 7) }'; then
                echo "::error::$name: installed size is ${size} MB, over 7 MB"; exit 1
              fi
            else
              grep -q 'checking installed package size \.\.\. OK' "$log" \
                || { echo "::error::$name: installed size is no longer OK"; exit 1; }
            fi
            grep -q 'checking Rust compilation \.\.\. OK' "$log" \
              || { echo "::error::$name: Rust compilation check regressed"; exit 1; }
            grep -q 'checking for GNU extensions in Makefiles \.\.\. OK' "$log" \
              || { echo "::error::$name: a vendored Makefile came back"; exit 1; }

            # Reported, not asserted: the size check above is the bound.
            so=$(find "${name}.Rcheck/${name}/libs" -name '*.so')
            echo "$name: $so is $(stat -c%s "$so") bytes"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r-cran-check-logs
          path: |
            ${{ runner.temp }}/rcheck/*.Rcheck/00check.log
            ${{ runner.temp }}/rcheck/*.Rcheck/00install.out
          if-no-files-found: warn

      # Handed to `r-windows-cran` below. Publishing the tarball rather than having
      # that job vendor for itself matches what CRAN does (build a source package
      # once, install it everywhere) and keeps the vendoring toolchain (python3, xz)
      # off the Windows runner.
      - uses: actions/upload-artifact@v7
        with:
          name: r-source-tarballs
          path: ${{ runner.temp }}/rcheck/*.tar.gz
          if-no-files-found: error

  # The oldest Rust the published crates and the R packages claim to build on:
  # `rust-version` in the two crates' manifests, and `SystemRequirements: rustc >=
  # 1.89` in both DESCRIPTION files. rust-toolchain.toml pins a newer release for
  # everything else, so without this job the minimum is never compiled.
  msrv:
    name: MSRV (Rust 1.89)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: '1.89'
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.89 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Published crates
        run: |
          cargo check --locked -p sas7bdat -p sas7bdat-convert
          cargo check --locked -p sas7bdat --features arrow,dictionary
      # extendr's build script reads the version of the installed R.
      - uses: r-lib/actions/setup-r@v2
      - name: R packages
        run: |
          (cd crates/r-plugin/src && cargo check --locked --manifest-path rust/Cargo.toml)
          (cd crates/r-convert-plugin/src && cargo check --locked --manifest-path rust/Cargo.toml)

  fuzz-regressions:
    name: fuzz regressions
    runs-on: ubuntu-latest
    # AddressSanitizer is nightly-only, so this job needs a nightly regardless of
    # what rust-toolchain.toml pins. cargo-fuzz shells out to cargo internally, so
    # the toolchain is selected with the environment variable rather than `+nightly`.
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-07-27
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly
        run: rustup toolchain install nightly-2026-07-27 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # `-runs=0` makes this a replay: every input in the directory is executed
      # once and the process exits. Without it, a directory argument is treated as a
      # corpus to extend, and the job fuzzes until the runner times out and writes
      # new units into the tracked fixture directory.
      #
      # So this cannot flake and cannot turn CI red on a newly discovered bug. It
      # fails only if a fixed crash comes back. tests/fuzz_regressions.rs asserts the
      # same inputs at the library level, and this adds AddressSanitizer, which the
      # normal test binary is not built with. Hunting for new bugs stays local
      # (`just fuzz`), because the seed corpus lives in the untracked repo-root
      # fixtures/ and is not available to CI.
      #
      # `dataset_open_path` replays the same .sas7bdat inputs through `Dataset::open`,
      # which reaches the fused single-pass scan that in-memory sources decline.
      # `catalog_parse` takes the .sas7bcat inputs, a different format.
      #
      # `--target` is required. cargo-fuzz defaults it to the triple of its own
      # executable, not the toolchain's host, and install-action ships a musl-linked
      # binary, so the default builds for x86_64-unknown-linux-musl and fails with
      # "sanitizer is incompatible with statically linked libc". Taking the triple
      # from rustc pins it to the toolchain that has a sanitizer runtime.
      - name: Replay fuzz artifacts under ASan
        run: |
          cd crates/sas7bdat
          host=$(rustc -vV | awk '/^host:/{print $2}')
          echo "building fuzz targets for $host"
          cargo fuzz run --target "$host" dataset_from_bytes tests/fixtures/fuzz -- -runs=0
          cargo fuzz run --target "$host" dataset_open_path tests/fixtures/fuzz -- -runs=0
          cargo fuzz run --target "$host" columnar_offsets tests/fixtures/fuzz -- -runs=0
          cargo fuzz run --target "$host" catalog_parse tests/fixtures/fuzz/catalog -- -runs=0

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on vulnerabilities; "unmaintained" advisories stay non-fatal warnings.
      # The R packages have their own lockfiles, and their dependencies ship inside
      # the source tarballs, so they are audited too.
      - name: Audit
        run: |
          cargo audit
