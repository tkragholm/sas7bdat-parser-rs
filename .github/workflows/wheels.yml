# Builds two distributions natively on each platform and uploads them as CI
# artifacts:
#
#   * sas7bdat-polars (crates/polars-plugin/) — the PyO3 extension module. abi3
#     (cp312-abi3), so one wheel per platform covers CPython 3.12+.
#   * sas7bdat-cli (crates/sas7bdat-cli/) — the standalone `sas7bdat` command as a
#     plain binary wheel (py3-none-<platform>): no Python floor, no polars pin.
#     It backs the `sas7bdat-polars[cli]` extra.
#
# On a `v*` tag, the `release*` jobs below publish to PyPI via Trusted Publishing
# (OIDC, no stored token). On branch/PR pushes the wheels are only uploaded as CI
# artifacts. The two packages carry independent version numbers, so `--check-url`
# makes a tag that only bumps one of them a no-op for the other instead of an
# "already exists" failure.
#
# Neither package lives at the repo root (the root pyproject.toml builds the
# sas7bdat-dir-mapper wheel), hence the explicit --manifest-path everywhere.
name: wheels

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `release-crate.yml` hard-fails when a tag and its manifest disagree; this
  # workflow had no equivalent. `uv publish --check-url` makes a tag that bumps only
  # one package a no-op for the other, which is the right behaviour — but it also
  # means a tag whose version matches *neither* package publishes nothing and still
  # reports success. That is a silent no-op, so check it up front.
  check-tag:
    name: check tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6
      - name: Tag must match a package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          polars=$(awk -F'"' '/^version = /{print $2; exit}' crates/polars-plugin/Cargo.toml)
          cli=$(awk -F'"' '/^version = /{print $2; exit}' crates/sas7bdat-cli/Cargo.toml)
          echo "tag $tag | sas7bdat-polars $polars | sas7bdat-cli $cli"
          if [ "$tag" != "$polars" ] && [ "$tag" != "$cli" ]; then
            echo "::error::tag v$tag matches neither package; nothing would publish and the run would still be green"
            exit 1
          fi

  linux:
    name: linux-${{ matrix.target }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # aarch64 builds run under QEMU emulation and are slow; swap the runner
        # to a native ARM runner (e.g. ubuntu-22.04-arm) to speed it up.
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
      # maturin-action takes the toolchain as an input and cannot read
      # rust-toolchain.toml itself, so the channel is read out of that file here.
      # One copy of the version, in the file rustup honours; a bump there is a
      # bump everywhere. The default SIMD backend builds on stable; only the
      # opt-in `nightly-simd` feature needs a nightly, and wheels do not enable it.
      - name: Read the pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: '2_28'
          rust-toolchain: ${{ steps.toolchain.outputs.channel }}
          args: --profile dist --manifest-path crates/polars-plugin/Cargo.toml --out dist -i python3.12
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist/*.whl
      # No interpreter flag: a `bindings = "bin"` wheel embeds no Python ABI.
      - name: Build CLI wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: '2_28'
          rust-toolchain: ${{ steps.toolchain.outputs.channel }}
          args: --profile dist --manifest-path crates/sas7bdat-cli/Cargo.toml --out dist-cli
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/upload-artifact@v6
        with:
          name: cli-wheels-linux-${{ matrix.target }}
          path: dist-cli/*.whl

  windows:
    name: windows-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      # maturin-action takes the toolchain as an input and cannot read
      # rust-toolchain.toml itself, so the channel is read out of that file here.
      # One copy of the version, in the file rustup honours; a bump there is a
      # bump everywhere. The default SIMD backend builds on stable; only the
      # opt-in `nightly-simd` feature needs a nightly, and wheels do not enable it.
      - name: Read the pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          rust-toolchain: ${{ steps.toolchain.outputs.channel }}
          args: --profile dist --manifest-path crates/polars-plugin/Cargo.toml --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-x64
          path: dist/*.whl
      - name: Build CLI wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          rust-toolchain: ${{ steps.toolchain.outputs.channel }}
          args: --profile dist --manifest-path crates/sas7bdat-cli/Cargo.toml --out dist-cli
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/upload-artifact@v6
        with:
          name: cli-wheels-windows-x64
          path: dist-cli/*.whl

  macos:
    name: macos-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            runner: macos-14   # Apple Silicon
    steps:
      - uses: actions/checkout@v6
      # maturin-action takes the toolchain as an input and cannot read
      # rust-toolchain.toml itself, so the channel is read out of that file here.
      # One copy of the version, in the file rustup honours; a bump there is a
      # bump everywhere. The default SIMD backend builds on stable; only the
      # opt-in `nightly-simd` feature needs a nightly, and wheels do not enable it.
      - name: Read the pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          rust-toolchain: ${{ steps.toolchain.outputs.channel }}
          args: --profile dist --manifest-path crates/polars-plugin/Cargo.toml --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/*.whl
      - name: Build CLI wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          rust-toolchain: ${{ steps.toolchain.outputs.channel }}
          args: --profile dist --manifest-path crates/sas7bdat-cli/Cargo.toml --out dist-cli
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/upload-artifact@v6
        with:
          name: cli-wheels-macos-${{ matrix.target }}
          path: dist-cli/*.whl

  # The polars range in crates/polars-plugin/pyproject.toml is a promise that the
  # wheel was run against its ends, and this is where the promise is kept: the
  # Linux wheel, installed under the oldest and the newest CPython the abi3 tag
  # claims, against the lowest and the highest polars the range admits, running
  # a file-backed round trip. A bound moves only with this job green on the new
  # value. Both ends are read from pyproject.toml, so the range is written once.
  compat:
    name: compat-py${{ matrix.python }}-polars-${{ matrix.polars }}
    runs-on: ubuntu-22.04
    needs: [linux]
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
        polars: [lowest, highest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v7
        with:
          name: wheels-linux-x86_64
          path: dist
      - name: Resolve the polars to test against
        id: polars
        run: |
          spec=$(python - <<'EOF'
          import tomllib
          with open("crates/polars-plugin/pyproject.toml", "rb") as f:
              deps = tomllib.load(f)["project"]["dependencies"]
          print(next(d[len("polars"):] for d in deps if d.startswith("polars")))
          EOF
          )
          lowest=$(printf '%s' "$spec" | tr ',' '\n' | sed -n 's/^>=//p')
          case "${{ matrix.polars }}" in
            lowest)  echo "requirement=polars==$lowest" >> "$GITHUB_OUTPUT" ;;
            highest) echo "requirement=polars$spec" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "range $spec, lowest $lowest"
      - name: Install the wheel against that polars
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ steps.polars.outputs.requirement }}" pytest
          python -m pip install --no-deps dist/*.whl
          python -c "import polars, sas7bdat_polars as sp; print('polars', polars.__version__, 'plugin', sp.__version__, 'core', sp.__core_version__)"
      # The pandas SAS test corpus is BSD-3-Clause; one 5 KB file is enough to
      # push Series of every kind the plugin emits through the boundary.
      - name: Fetch the fixture
        run: |
          mkdir -p fixtures/raw_data/pandas
          curl -sSfL -o fixtures/raw_data/pandas/airline.sas7bdat \
            https://raw.githubusercontent.com/pandas-dev/pandas/v2.2.3/pandas/tests/io/sas/data/airline.sas7bdat
      - name: Round trip
        run: >
          python -m pytest -p no:cacheprovider
          crates/polars-plugin/tests/test_compat.py
          crates/polars-plugin/tests/test_arrow_stream.py
          crates/polars-plugin/tests/test_version_check.py
          crates/polars-plugin/tests/test_smoke.py::test_public_api_contract_is_exposed

  # Publishes to PyPI via Trusted Publishing (OIDC) — no stored token. Runs only on a
  # v* tag, after every platform build succeeds. Requires a trusted publisher registered
  # on PyPI for owner=tkragholm, repo=sas7bdat-parser-rs, workflow=wheels.yml — one per
  # project (sas7bdat-polars and sas7bdat-cli each need their own).
  #
  # --check-url skips files already on PyPI, so tagging a release that bumps only one of
  # the two packages leaves the other alone instead of failing on a duplicate upload.
  release:
    name: publish-pypi
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [linux, windows, macos]
    permissions:
      # Mints the OIDC token PyPI Trusted Publishing exchanges for a short-lived upload token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
      - uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        run: >
          uv publish --trusted-publishing always
          --check-url https://pypi.org/simple/
          'wheels-*/*.whl'

  release-cli:
    name: publish-pypi-cli
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [linux, windows, macos]
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: cli-wheels-*
      - uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        run: >
          uv publish --trusted-publishing always
          --check-url https://pypi.org/simple/
          'cli-wheels-*/*.whl'
