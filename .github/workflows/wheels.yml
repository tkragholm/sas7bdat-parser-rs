# Builds two distributions natively on each platform and uploads them as CI
# artifacts:
#
#   * sas7bdat-polars (crates/polars-plugin/) — the PyO3 extension module. abi3
#     (cp312-abi3), so one wheel per platform covers CPython 3.12+.
#   * sas7bdat-cli (crates/sas7bdat-cli/) — the standalone `sas7bdat` command as a
#     plain binary wheel (py3-none-<platform>): no Python floor, no polars pin.
#     It backs the `sas7bdat-polars[cli]` extra.
#
# A `sas7bdat-polars-v<version>` or `sas7bdat-cli-v<version>` tag publishes that
# package to PyPI via Trusted Publishing (OIDC, no stored token). The two packages
# have independent version numbers, so each has its own tag prefix. On branch and
# PR pushes the wheels are only uploaded as CI artifacts.
#
# Neither package lives at the repo root (the root pyproject.toml builds the
# sas7bdat-dir-mapper wheel), hence the explicit --manifest-path everywhere.
name: wheels

on:
  push:
    branches: [main]
    tags: ['sas7bdat-polars-v*', 'sas7bdat-cli-v*']
  pull_request:
  workflow_dispatch:
  # Weekly, so a new polars release that breaks the plugin shows up without a push:
  # the compat matrix's `highest` resolves to whatever polars is newest that day.
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  # A run on a tag is a release; never cancel one part-way through an upload.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # A tag names one package and one version. Fail here when the version is not the
  # one in that package's manifest, so a wrong tag publishes nothing and is red.
  check-tag:
    name: check tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # The publish jobs below gate on `package`, so each runs only for its own tag.
    outputs:
      package: ${{ steps.versions.outputs.package }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match the package's version
        id: versions
        run: |
          package="${GITHUB_REF_NAME%-v*}"
          tagged="${GITHUB_REF_NAME##*-v}"
          case "$package" in
            sas7bdat-polars) dir=crates/polars-plugin ;;
            sas7bdat-cli) dir=crates/sas7bdat-cli ;;
            *) echo "::error::tag $GITHUB_REF_NAME names no wheel package"; exit 1 ;;
          esac
          version=$(awk -F'"' '/^version = /{print $2; exit}' "$dir/Cargo.toml")
          echo "tag $GITHUB_REF_NAME | $package $version"
          if [ "$tagged" != "$version" ]; then
            echo "::error::tag says $tagged but $dir/Cargo.toml says $version"
            exit 1
          fi
          echo "package=$package" >> "$GITHUB_OUTPUT"

  linux:
    name: linux-${{ matrix.target }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # aarch64 builds run under QEMU emulation and are slow; swap the runner
        # to a native ARM runner (e.g. ubuntu-22.04-arm) to speed it up.
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      # maturin-action takes the toolchain as an input and cannot read
      # rust-toolchain.toml itself, so the channel is read out of that file here.
      # One copy of the version, in the file rustup honours; a bump there is a
      # bump everywhere. The default SIMD backend builds on stable; only the
      # opt-in `nightly-simd` feature needs a nightly, and wheels do not enable it.
      - name: Read the pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: '2_28'
          rust-toolchain: ${{ steps.toolchain.outputs.channel }}
          args: --profile dist-py --manifest-path crates/polars-plugin/Cargo.toml --out dist -i python3.12
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist/*.whl
      # No interpreter flag: a `bindings = "bin"` wheel embeds no Python ABI.
      - name: Build CLI wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: '2_28'
          rust-toolchain: ${{ steps.toolchain.outputs.channel }}
          args: --profile dist --manifest-path crates/sas7bdat-cli/Cargo.toml --out dist-cli
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/upload-artifact@v7
        with:
          name: cli-wheels-linux-${{ matrix.target }}
          path: dist-cli/*.whl

  windows:
    name: windows-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # maturin-action takes the toolchain as an input and cannot read
      # rust-toolchain.toml itself, so the channel is read out of that file here.
      # One copy of the version, in the file rustup honours; a bump there is a
      # bump everywhere. The default SIMD backend builds on stable; only the
      # opt-in `nightly-simd` feature needs a nightly, and wheels do not enable it.
      - name: Read the pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          rust-toolchain: ${{ steps.toolchain.outputs.channel }}
          args: --profile dist-py --manifest-path crates/polars-plugin/Cargo.toml --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x64
          path: dist/*.whl
      - name: Build CLI wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          rust-toolchain: ${{ steps.toolchain.outputs.channel }}
          args: --profile dist --manifest-path crates/sas7bdat-cli/Cargo.toml --out dist-cli
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/upload-artifact@v7
        with:
          name: cli-wheels-windows-x64
          path: dist-cli/*.whl

  macos:
    name: macos-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            runner: macos-15   # Apple Silicon
    steps:
      - uses: actions/checkout@v7
      # maturin-action takes the toolchain as an input and cannot read
      # rust-toolchain.toml itself, so the channel is read out of that file here.
      # One copy of the version, in the file rustup honours; a bump there is a
      # bump everywhere. The default SIMD backend builds on stable; only the
      # opt-in `nightly-simd` feature needs a nightly, and wheels do not enable it.
      - name: Read the pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          rust-toolchain: ${{ steps.toolchain.outputs.channel }}
          args: --profile dist-py --manifest-path crates/polars-plugin/Cargo.toml --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/*.whl
      - name: Build CLI wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          rust-toolchain: ${{ steps.toolchain.outputs.channel }}
          args: --profile dist --manifest-path crates/sas7bdat-cli/Cargo.toml --out dist-cli
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/upload-artifact@v7
        with:
          name: cli-wheels-macos-${{ matrix.target }}
          path: dist-cli/*.whl

  # The polars range in crates/polars-plugin/pyproject.toml is a promise that the
  # wheel was run against its ends, and this is where the promise is kept: the
  # Linux wheel, installed under the oldest and the newest CPython the abi3 tag
  # claims, against the lowest and the highest polars the range admits, running
  # the plugin's test suite on the tracked fixtures. A bound moves only with this
  # job green on the new value. Both ends are read from pyproject.toml, so the
  # range is written once. Tests whose fixtures are not tracked skip themselves.
  compat:
    name: compat-py${{ matrix.python }}-polars-${{ matrix.polars }}
    runs-on: ubuntu-22.04
    needs: [linux]
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
        polars: [lowest, highest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-x86_64
          path: dist
      - name: Resolve the polars to test against
        id: polars
        run: |
          spec=$(python - <<'EOF'
          import tomllib
          with open("crates/polars-plugin/pyproject.toml", "rb") as f:
              deps = tomllib.load(f)["project"]["dependencies"]
          print(next(d[len("polars"):] for d in deps if d.startswith("polars")))
          EOF
          )
          lowest=$(printf '%s' "$spec" | tr ',' '\n' | sed -n 's/^>=//p')
          case "${{ matrix.polars }}" in
            lowest)  echo "requirement=polars==$lowest" >> "$GITHUB_OUTPUT" ;;
            highest) echo "requirement=polars$spec" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "range $spec, lowest $lowest"
      - name: Install the wheel against that polars
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ steps.polars.outputs.requirement }}" pytest
          python -m pip install --no-deps dist/*.whl
          python -c "import polars, sas7bdat_polars as sp; print('polars', polars.__version__, 'plugin', sp.__version__, 'core', sp.__core_version__)"
      # The pandas SAS test corpus is BSD-3-Clause; one 5 KB file is enough to
      # push Series of every kind the plugin emits through the boundary.
      - name: Fetch the fixture
        run: |
          mkdir -p fixtures/raw_data/pandas
          curl -sSfL -o fixtures/raw_data/pandas/airline.sas7bdat \
            https://raw.githubusercontent.com/pandas-dev/pandas/v2.2.3/pandas/tests/io/sas/data/airline.sas7bdat
      - name: Test suite
        run: python -m pytest -p no:cacheprovider crates/polars-plugin/tests

  # The core and the plugin's Rust side, tested on the commit being built. ci.yml
  # runs the same on every push to main, but a tag can point at any commit, and a
  # tag pushed right after main does not wait for that run. The publish jobs need
  # this, as release-crate.yml re-tests before uploading to crates.io.
  core-tests:
    name: core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # PyO3 needs a Python to link the plugin's test binary.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test -p sas7bdat -p sas7bdat-polars -p sas7bdat-cli

  # Every built wheel, installed and run on its own platform: the extension module
  # imported and read through, the CLI wheel's `sas7bdat` run on a file. Linux
  # aarch64 is left out; it would need an arm runner.
  smoke:
    name: smoke-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: [linux, windows, macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: windows-x64
            runner: windows-latest
          - platform: macos-aarch64
            runner: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: wheels-${{ matrix.platform }}
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: cli-wheels-${{ matrix.platform }}
          path: dist-cli
      - name: Fetch a fixture
        run: |
          curl -sSfL -o airline.sas7bdat \
            https://raw.githubusercontent.com/pandas-dev/pandas/v2.2.3/pandas/tests/io/sas/data/airline.sas7bdat
      - name: Install and run both wheels
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl dist-cli/*.whl
          python -c "import sas7bdat_polars as sp; df = sp.read_sas('airline.sas7bdat'); assert df.shape == (32, 6), df.shape; print(df.shape)"
          sas7bdat --version
          sas7bdat info airline.sas7bdat

  # Publishes to PyPI via Trusted Publishing (OIDC), no stored token. Runs only on
  # that package's tag, after every platform build, the compat matrix and the smoke
  # tests succeed. Requires a trusted publisher registered
  # on PyPI for owner=tkragholm, repo=sas7bdat-parser-rs, workflow=wheels.yml — one per
  # project (sas7bdat-polars and sas7bdat-cli each need their own).
  #
  # Each publish job runs only for its own package's tag. `--check-url` alone is not
  # enough: it skips a file already on PyPI only when the hashes match, and two runs
  # do not build byte-identical wheels. If the second tag rebuilt both packages, it
  # would fail on a hash mismatch for the one already published.
  release:
    name: publish-pypi
    runs-on: ubuntu-latest
    if: ${{ needs.check-tag.outputs.package == 'sas7bdat-polars' }}
    needs: [check-tag, linux, windows, macos, compat, smoke, core-tests]
    permissions:
      # Mints the OIDC token PyPI Trusted Publishing exchanges for a short-lived upload token.
      id-token: write
    steps:
      # The publish jobs hold an upload token, so their actions are pinned to a
      # commit; Dependabot moves the pins.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Publish to PyPI
        run: >
          uv publish --trusted-publishing always
          --check-url https://pypi.org/simple/
          'wheels-*/*.whl'

  release-cli:
    name: publish-pypi-cli
    runs-on: ubuntu-latest
    if: ${{ needs.check-tag.outputs.package == 'sas7bdat-cli' }}
    needs: [check-tag, linux, windows, macos, compat, smoke, core-tests]
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-wheels-*
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Publish to PyPI
        run: >
          uv publish --trusted-publishing always
          --check-url https://pypi.org/simple/
          'cli-wheels-*/*.whl'
