# Publish one of this repository's library crates to crates.io.
#
# Triggered by a `<crate>-v<version>` tag. Two crates publish from here:
#
#   sas7bdat-v0.7.0           the reader
#   sas7bdat-convert-v0.1.0   conversion to Parquet/CSV/TSV
#
# The patterns are disjoint from each other and from the bare `v*` tags wheels.yml
# claims for the Python packages, so no tag can start two releases. `sas7bdat-cli`
# and `sas7bdat-polars` are `publish = false` and ship as wheels instead.
#
# Publishing is irreversible: crates.io has no unpublish, only `cargo yank`, which
# hides a version without removing it. Everything below is arranged around that —
# the version is cross-checked against the tag, the suite has to pass on the tagged
# commit, and a dry run has to package and compile before the real upload.
name: release-crate

on:
  push:
    tags:
      - 'sas7bdat-v*'
      - 'sas7bdat-convert-v*'
  # Lets you exercise everything except the upload against any ref.
  workflow_dispatch:
    inputs:
      crate:
        description: 'Crate to verify'
        type: choice
        options: [sas7bdat, sas7bdat-convert]
        default: sas7bdat
      dry_run:
        description: 'Verify only; do not upload to crates.io'
        type: boolean
        default: true

concurrency:
  group: release-crate-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Resolves what is being released and whether there is anything left to do. Kept
  # separate from `publish` so "already released" can skip the rest of the workflow
  # in one place rather than as a condition repeated on every step below.
  check:
    name: check
    runs-on: ubuntu-latest
    outputs:
      crate: ${{ steps.target.outputs.crate }}
      version: ${{ steps.target.outputs.version }}
      published: ${{ steps.published.outputs.published }}
    steps:
      - uses: actions/checkout@v6

      # The tag is the only thing a human types, so it is the only thing that can
      # disagree with the manifest. A tag is `<crate>-v<version>`; splitting on the
      # last `-v` is what keeps `sas7bdat-convert-v0.1.0` from parsing as the crate
      # `sas7bdat` at version `convert-v0.1.0`.
      #
      # This mismatch stays a hard failure. Unlike an already-published version it
      # cannot be a benign repeat — it means the tag and the manifest disagree about
      # what is being released, and guessing which one is right is not this
      # workflow's call to make.
      - name: Resolve crate and version
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            crate='${{ inputs.crate }}'
            tagged=''
          else
            tag="$GITHUB_REF_NAME"
            crate="${tag%-v*}"
            tagged="${tag##*-v}"
          fi
          manifest="$(cargo metadata --format-version 1 --no-deps \
            | python3 -c "import json,sys;n=sys.argv[1];print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']==n))" "$crate")"
          if [ -n "$tagged" ] && [ "$tagged" != "$manifest" ]; then
            echo "tag says $tagged, $crate/Cargo.toml says $manifest"
            exit 1
          fi
          echo "crate=$crate"     >> "$GITHUB_OUTPUT"
          echo "version=$manifest" >> "$GITHUB_OUTPUT"
          echo "Releasing $crate $manifest"

      # A version already on crates.io ends the workflow successfully rather than
      # failing it. The case this is built around is a new crate's *first* release:
      # Trusted Publishing has to be configured per crate and a crate must exist to
      # have settings, so the first upload is always by hand — and the tag that
      # records it would otherwise land as a permanent red run.
      #
      # What this gives up: a genuinely mistaken re-tag now passes quietly instead of
      # loudly. It cannot publish anything wrong either way — crates.io rejects a
      # duplicate version regardless — so the cost is a missing signal, not a missing
      # safeguard.
      #
      # Queried against the sparse index rather than the REST API: the index is a
      # plain static file, has no bot filtering in front of it, and is the same
      # source cargo itself resolves from. Its directory layout depends on the name
      # length, hence the cases.
      - name: Is this version already published?
        id: published
        env:
          CRATE: ${{ steps.target.outputs.crate }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          n=${#CRATE}
          case "$n" in
            1) prefix="1" ;;
            2) prefix="2" ;;
            3) prefix="3/${CRATE:0:1}" ;;
            *) prefix="${CRATE:0:2}/${CRATE:2:2}" ;;
          esac
          url="https://index.crates.io/$prefix/$CRATE"
          echo "index: $url"
          # A crate with no releases yet is a 404, which is not an error here.
          index="$(curl -sS --max-time 30 "$url" || true)"
          if printf '%s' "$index" | grep -qF "\"vers\":\"$VERSION\""; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$CRATE $VERSION is already on crates.io — nothing to publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "$CRATE $VERSION is not yet published"
          fi

  publish:
    name: publish
    needs: check
    if: needs.check.outputs.published != 'true'
    runs-on: ubuntu-latest
    # The environment is a review gate, not a credential store: with Trusted
    # Publishing there is no token to keep. Add required reviewers to it under
    # Settings > Environments if the upload should need a second pair of eyes.
    environment: crates-io
    permissions:
      # Lets the job ask GitHub for the OIDC token crates.io trades for a
      # short-lived publishing token. Without it the auth step cannot run.
      id-token: write
      # `write`, not `read`: the last step drafts a GitHub release, which the API
      # refuses with `403 Resource not accessible by integration` under `read`. That
      # failed *after* 0.8.0 had already gone to crates.io — the upload is the
      # irreversible part and it had succeeded, so the red run was only a missing
      # draft, but it made a successful publish look like a failed one.
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Show toolchain
        run: rustup show && cargo --version

      # `save-if: false` is about the *post* step, not the cache. `cargo publish
      # --dry-run` below leaves an unpacked copy of the crate at
      # `target/package/<crate>-<version>/`, and rust-cache's cleanup walks the target
      # tree treating each subdirectory as a build profile -- so it takes that copy's
      # `tests/` for one and looks for `tests/target` and `tests/trybuild`, trybuild's
      # output directories, which this crate has never had. Its guard around that is
      # `try { cleanTargetDir(..) } catch {}` with no `await`, so the rejection escapes
      # a synchronous catch and Actions renders it at failure level. The 0.8.1 release
      # published cleanly and still carried four red annotations.
      #
      # Skipping the save returns before any of that cleanup runs. The restore still
      # happens, and saving a tag build's target directory was worth little anyway:
      # this job runs once per release.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false

      # ci.yml already runs these on every push to main, but a tag can point at any
      # commit. Re-running them here means the artifact that reaches crates.io was
      # tested, rather than something that merely shares a branch with a green run.
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Packages and compiles the exact archive that would be uploaded. `--locked`
      # ensures it resolves against the committed lockfile rather than whatever the
      # registry happens to offer today.
      - name: Package and verify
        run: cargo publish --dry-run --locked -p ${{ needs.check.outputs.crate }}

      # `**` matters: cargo used to leave the archive in `target/package/`, and now
      # writes it to `target/package/tmp-crate/`. A glob pinned to the old location
      # silently matched nothing, and because this step runs before the upload — so
      # that the artifact survives a failed publish — `if-no-files-found: error`
      # turned that into a failed release rather than a missing attachment. Keep the
      # recursive glob so it works either way.
      - name: Upload the packaged crate as a build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ needs.check.outputs.crate }}-crate
          path: target/package/**/*.crate
          if-no-files-found: error

      # Trusted Publishing: GitHub vouches for this workflow over OIDC and crates.io
      # returns a token that lasts 30 minutes and is revoked when the job ends. No
      # long-lived secret is stored anywhere, so there is nothing to rotate or leak.
      #
      # It has to be configured per crate, in that crate's settings on crates.io, and
      # a crate must already exist to have settings — so the *first* release of a new
      # crate is published by hand and every release after it comes through here.
      - name: Authenticate to crates.io
        id: auth
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.dry_run == false }}
        uses: rust-lang/crates-io-auth-action@v1

      # The only irreversible step.
      - name: Publish to crates.io
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.dry_run == false }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p ${{ needs.check.outputs.crate }}

      # Draft, not published: release notes want a human to read them before they go
      # out, and the crate is already live by this point regardless.
      #
      # Note this is skipped along with the rest of the job when the version was
      # published by hand — a first release gets its GitHub release written by hand
      # too, or not at all.
      - name: Draft a GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          CRATE: ${{ needs.check.outputs.crate }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          notes="Crate: https://crates.io/crates/$CRATE/$VERSION"
          changelog="crates/$CRATE/CHANGELOG.md"
          if [ -f "$changelog" ]; then
            notes="See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/${changelog}) for the full entry.

          $notes"
          fi
          # Same reason as the artifact step: locate the archive rather than
          # assuming which directory cargo left it in.
          archive="$(find target/package -name '*.crate' -print -quit)"
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$CRATE $VERSION" \
            --notes "$notes" \
            "$archive"
