[package]
name = "sas7bdat-profiler"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1"
mimalloc = { version = "0.1.48", default-features = false, features = ["secure", "v3"] }
rayon = "1.11"
sas7bdat-simd = { path = "../sas7bdat-simd" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1.44"
tracing-indicatif = "0.3.14"
tracing-subscriber = "0.3.23"
