[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "sas7bdat-polars"
version = "0.1.0"
description = "Thin Polars IO plugin for sas7bdat-simd"
requires-python = ">=3.8"
dependencies = ["polars"]

[project.optional-dependencies]
test = ["pytest"]

[tool.maturin]
bindings = "pyo3"
manifest-path = "Cargo.toml"
features = ["extension-module"]
