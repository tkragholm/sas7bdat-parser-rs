[package]
name = "sas7bdat-polars"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "sas7bdat_polars"
crate-type = ["cdylib", "rlib"]

[dependencies]
arrow-schema = { version = "58.1.0", optional = true }
bytemuck = { version = "1", features = ["derive"] }
polars = "0.53.0"
polars-arrow = "0.53.0"
polars-plan = { version = "0.53.0", features = ["serde"] }
pyo3 = "0.27"
pyo3-polars = "0.26.0"
rmp-serde = "1"
sas7bdat = { path = "../sas7bdat", features = ["arrow"] }

[features]
default = ["arrow"]
arrow = ["dep:arrow-schema", "sas7bdat/arrow"]
extension-module = ["pyo3/extension-module"]
