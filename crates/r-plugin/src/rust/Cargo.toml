[package]
name = "fastsas"
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib"]
name = "fastsas"

[dependencies]
extendr-api = "0.7"
# Same version extendr-api 0.7 depends on, so `SEXP` is the identical type.
# Used for the hot string path (raw SET_STRING_ELT / Rf_mkCharLenCE), bypassing
# extendr's per-call thread-guard + bounds-check overhead.
libR-sys = "0.7.1"
# Depended on by version, not by path, so that a package built with `R CMD build`
# — which copies these sources out of the workspace — can still resolve it. The
# repository redirects it back to the working tree via `src/.cargo/config.toml`;
# `.Rbuildignore` strips that file, so a tarball gets the published crate.
sas7bdat = { version = "0.8", features = ["dictionary"] }

# Detach from the parent cargo workspace: an R package's Rust crate builds
# standalone (and is copied in isolation by R CMD INSTALL).
[workspace]

[profile.release]
# R catches Rust panics and converts them to R errors, which requires unwinding.
# Do NOT set panic = "abort" here.
opt-level = 3
lto = "thin"
