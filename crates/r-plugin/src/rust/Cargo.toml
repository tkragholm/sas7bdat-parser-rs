[package]
name = "fastsas"
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib"]
name = "fastsas"

[dependencies]
extendr-api = "0.7"
# Same version extendr-api 0.7 depends on, so `SEXP` is the identical type.
# Used for the hot string path (raw SET_STRING_ELT / Rf_mkCharLenCE), bypassing
# extendr's per-call thread-guard + bounds-check overhead.
libR-sys = "0.7.1"
# Path dependency on the workspace core. For a distributable package this is
# vendored or published to crates.io (see docs/r-bindings/design-direct-fill.md);
# for local dev the relative path resolves against the repo.
sas7bdat = { path = "../../../sas7bdat", features = ["dictionary"] }

# Detach from the parent cargo workspace: an R package's Rust crate builds
# standalone (and is copied in isolation by R CMD INSTALL).
[workspace]

[profile.release]
# R catches Rust panics and converts them to R errors, which requires unwinding.
# Do NOT set panic = "abort" here.
opt-level = 3
lto = "thin"
