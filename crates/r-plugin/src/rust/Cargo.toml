[package]
name = "fastsas"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib"]
name = "fastsas"

[dependencies]
extendr-api = "0.9"
# Same version extendr-api 0.7 depends on, so `SEXP` is the identical type.
# Used for the hot string path (raw SET_STRING_ELT / Rf_mkCharLenCE), bypassing
# extendr's per-call thread-guard + bounds-check overhead.
extendr-ffi = "0.9"
# Depended on by version, not by path, so that a package built with `R CMD build`
# — which copies these sources out of the workspace — can still resolve it. The
# repository redirects it back to the working tree via `src/.cargo/config.toml`;
# `.Rbuildignore` strips that file, so a tarball gets the published crate.
sas7bdat = { version = "0.10.3", features = ["dictionary"] }
# The string cache's hasher. Already in the dependency tree through `dictionary`, so
# it adds nothing to the vendored crates.
ahash = "0.8"

# Detach from the parent cargo workspace: an R package's Rust crate builds
# standalone (and is copied in isolation by R CMD INSTALL).
[workspace]

[profile.release]
# R catches Rust panics and converts them to R errors, which requires unwinding.
# Do NOT set panic = "abort" here.
opt-level = 3
# Sized for CRAN's 5 MB installed-size NOTE, and measured throughput-neutral. See the
# sibling `fastsasconvert` manifest for the numbers behind both claims — this package
# links a subset of the same crates, so the same reasoning applies.
#
# There is no `strip` here. CRAN's policy asks packages to keep the symbols in their
# shared objects, and cargo's `-Cstrip` would be a no-op on a `staticlib` anyway.
lto = "fat"
codegen-units = 1
