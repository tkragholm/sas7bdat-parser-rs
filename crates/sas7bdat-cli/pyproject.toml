[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "sas7bdat-cli"
version = "0.8.0"
description = "Fast command-line converter and inspector for SAS7BDAT files"
readme = "README.md"
license = "MIT"
# A binary wheel: it ships a self-contained executable, not an extension module,
# so it is tagged `py3-none-<platform>` and works with any CPython/PyPy.
requires-python = ">=3.8"
keywords = ["sas", "sas7bdat", "parquet", "csv", "cli", "convert"]
# No "License :: OSI Approved :: ..." classifier here: PEP 639 makes it mutually
# exclusive with the `license` SPDX expression above, and PyPI rejects both together.
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/tkragholm/sas7bdat-parser-rs"
Repository = "https://github.com/tkragholm/sas7bdat-parser-rs"
Issues = "https://github.com/tkragholm/sas7bdat-parser-rs/issues"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
# maturin packages every binary the cargo build produced — there is no `--bin`
# filter — so the feature gates in Cargo.toml are what keep this wheel down to
# the single `sas7bdat` command (no aliases, no dir-mapper, no dev tools).
no-default-features = true
features = ["cli"]
locked = true
