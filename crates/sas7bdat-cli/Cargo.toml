[package]
name = "sas7bdat-cli"
version = "0.9.2"
edition = "2024"
rust-version = "1.85"
description = "Standalone CLI tools for converting, inspecting, and profiling SAS7BDAT files"
license = "MIT"
repository = "https://github.com/tkragholm/sas7bdat-parser-rs"
publish = false

[lib]
name = "sas7bdat_cli"

# The one unified, user-facing tool: `sas7bdat <convert|info|head|completions>`.
[[bin]]
name = "sas7bdat"
path = "src/bin/sas7bdat.rs"
required-features = ["cli"]

# Thin backward-compatible aliases for the unified subcommands.
[[bin]]
name = "sas7bdat-convert"
path = "src/bin/sas7bdat_convert.rs"
required-features = ["aliases"]

[[bin]]
name = "sas7bdat-inspect"
path = "src/bin/sas7bdat_inspect.rs"
required-features = ["aliases"]

# Developer/profiling tools — built only with `--features dev-tools` so a default
# build/install ships just the user-facing binaries above.
[[bin]]
name = "sas7bdat-corpus-catalog"
path = "src/bin/sas7bdat_corpus_catalog.rs"
required-features = ["dev-tools"]

[[bin]]
name = "sas7bdat-corpus-profile"
path = "src/bin/sas7bdat_corpus_profile.rs"
required-features = ["dev-tools"]

[[bin]]
name = "sas7bdat-fixture-profile"
path = "src/bin/sas7bdat_fixture_profile.rs"
required-features = ["dev-tools"]

[[bin]]
name = "sas7bdat-fixture-string-profile"
path = "src/bin/sas7bdat_fixture_string_profile.rs"
required-features = ["dev-tools"]

[[bin]]
name = "sas7bdat-dir-mapper"
path = "src/bin/sas7bdat_dir_mapper.rs"
required-features = ["dir-mapper"]

# Every user-facing binary is in `default`, so `cargo build` / `cargo install` /
# `just convert` behave exactly as they did before these gates existed.
#
# The gates exist for the Python wheels: maturin has no `--bin` filter (a
# `bindings = "bin"` build packages *every* binary cargo produced), so each
# pyproject.toml selects its one binary with `no-default-features` plus the
# matching feature — `cli` for the sas7bdat-cli wheel, `dir-mapper` for the
# sas7bdat-dir-mapper wheel.
[features]
default = ["cli", "aliases", "dir-mapper"]
# The unified `sas7bdat` binary.
cli = []
# The `sas7bdat-convert` / `sas7bdat-inspect` compatibility aliases.
aliases = []
# The `sas7bdat-dir-mapper` tool.
dir-mapper = []
# Developer/profiling binaries. The tracing stack is theirs alone (only
# sas7bdat-corpus-profile uses it), so it stays out of the shipped `sas7bdat`.
dev-tools = [
  "dep:tracing",
  "dep:tracing-indicatif",
  "dep:tracing-subscriber",
  # the corpus binaries drive the core crate's fixture profiling
  "sas7bdat/fixture-catalog",
]

[dependencies]
anyhow = { workspace = true }
arrow-schema = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
clap_complete = "4"
csv = { workspace = true }
terminal_size = "0.4"
indicatif = { workspace = true }
mimalloc = { workspace = true }
parquet = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true, optional = true }
tracing-indicatif = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
walkdir = { workspace = true }
sas7bdat = { path = "../sas7bdat", features = ["arrow"] }
sas7bdat-convert = { path = "../sas7bdat-convert" }

[lints]
workspace = true
