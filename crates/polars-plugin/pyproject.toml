[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "sas7bdat-polars"
version = "0.10.3"
description = "SAS7BDAT files as Arrow streams, with a Polars API on top"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-ReadStat"]
# Built against the CPython stable ABI (abi3, floor 3.12), so one cp312-abi3 wheel runs on 3.12+.
requires-python = ">=3.12"
authors = [{ name = "Tobias Kragholm" }]
keywords = ["sas", "sas7bdat", "polars", "arrow", "parquet", "statistics"]
# No "License :: OSI Approved :: ..." classifier: PEP 639 makes it mutually
# exclusive with the `license` SPDX expression above.
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
# A floor and no ceiling. The compiled extension does not link polars: it hands
# every batch to Python as an Arrow C stream behind `__arrow_c_stream__`, and
# the polars API in `python/sas7bdat_polars/` is built on polars' public
# constructors (`pl.DataFrame(stream)`, `polars.io.plugins.register_io_source`).
# The floor is the oldest release the `compat` job in
# `.github/workflows/wheels.yml` runs the wheel against; the same job runs the
# newest release polars has published, so a new polars that breaks the public
# API shows there rather than on a user. The import-time check in `__init__.py`
# reads this specifier from the installed metadata, so it is written once.
# 1.41.1 rather than 1.41: polars-runtime-32 1.41.0 was yanked, which uv refuses
# to install.
dependencies = ["polars>=1.41.1"]

[project.optional-dependencies]
test = ["pytest"]
# `pip install "sas7bdat-polars[cli]"` also installs the standalone `sas7bdat`
# command. It is a separate distribution on purpose: that wheel is a plain
# binary (`py3-none-<platform>`) with no polars requirement and no Python floor.
cli = ["sas7bdat-cli>=0.8.0"]

[project.urls]
Homepage = "https://github.com/tkragholm/sas7bdat-parser-rs"
Repository = "https://github.com/tkragholm/sas7bdat-parser-rs"
Documentation = "https://github.com/tkragholm/sas7bdat-parser-rs/tree/main/crates/polars-plugin#readme"
Issues = "https://github.com/tkragholm/sas7bdat-parser-rs/issues"
Changelog = "https://github.com/tkragholm/sas7bdat-parser-rs/blob/main/crates/sas7bdat/CHANGELOG.md"

[tool.maturin]
bindings = "pyo3"
manifest-path = "Cargo.toml"
features = ["extension-module"]
locked = true
# Mixed layout: the compiled extension is placed inside the `sas7bdat_polars`
# package (as a submodule) and the hand-written `__init__.py` is the API.
python-source = "python"
