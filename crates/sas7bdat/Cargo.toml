[package]
name = "sas7bdat"
version = "0.7.0"
edition = "2024"
description = "SIMD-accelerated SAS7BDAT reader with optional Arrow batch output"
license = "MIT"
repository = "https://github.com/tkragholm/sas7bdat-parser-rs"
documentation = "https://docs.rs/sas7bdat"
readme = "README.md"
keywords = ["sas7bdat", "sas", "arrow", "parser", "simd"]
# "statistics" is not a crates.io slug; "encoding" covers decoding the on-disk format.
categories = ["parser-implementations", "science", "encoding"]

[dependencies]
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
bytemuck = { workspace = true }
encoding_rs = { workspace = true }
# Stable-Rust SIMD with runtime dispatch (feature = "simd"). Unlike `std::simd`,
# which lowers to whatever target features were enabled at compile time, this
# detects AVX2/AVX-512 at runtime — which is the only way a portable binary
# (crates.io, a wheel, an R tarball) gets above SSE2 on x86-64.
fearless_simd = { version = "0.7", optional = true }
hotpath = { workspace = true, optional = true }
memchr = { workspace = true }
memmap2 = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
simdutf8 = { workspace = true }
# Optional string-column dictionary encoding (feature = "dictionary").
ahash = { version = "0.8.7", optional = true }
lasso2 = { version = "0.8", optional = true }
cardinality-estimator = { version = "1.0.1", optional = true }

[dev-dependencies]
criterion = { workspace = true }
csv = { workspace = true }
# Only examples/ and benches/ use it; it was a regular dependency, so every
# consumer of the published crate compiled it for nothing.
serde_json = { workspace = true }
# Self dev-dependency: turns `fixture-catalog` on for tests, benches and examples
# without exposing it to consumers, so `cargo bench` needs no extra flags.
sas7bdat = { path = ".", features = ["fixture-catalog"] }

[[example]]
name = "bench_dict"
required-features = ["dictionary"]

[[bench]]
name = "scan_hotpaths"
harness = false

[[bench]]
name = "compression_matrix"
harness = false

[[bench]]
name = "backend_matrix"
harness = false

[[bench]]
name = "wide_table"
harness = false
required-features = ["internal-bench"]

[features]
default = ["simd"]
# SIMD backend selection. The kernels in `src/simd` have three implementations and
# exactly one is live; see that module for the precedence rule and for which
# kernels each backend actually wins on.
#
#   (neither)      scalar, stable, MSRV-friendly. The correctness oracle, and the
#                  only configuration that can target CRAN's Rust 1.81.
#   simd           fearless_simd — stable (needs 1.89), runtime-dispatched.
#   nightly-simd   std::simd — requires a nightly toolchain. Overrides `simd`.
simd = ["dep:fearless_simd"]
nightly-simd = []
arrow = ["dep:arrow-array", "dep:arrow-schema"]
hotpath-profile = ["dep:hotpath"]
# Exposes `test_utils` (synthetic dataset builders) for the `wide_table` benchmark.
internal-bench = []
# Exposes `fixture_catalog` (corpus profiling for the benchmark harness and the
# dev-tools CLI binaries). Off by default: it is in-repo tooling, not reader API,
# and consumers of the crate have no fixture corpus to point it at.
fixture-catalog = []
# String-column dictionary encoding: HLL cardinality gate + lasso2 interner.
dictionary = ["dep:ahash", "dep:lasso2", "dep:cardinality-estimator"]

# Build docs.rs with both public features so their APIs — and the intra-doc links to
# them from the crate-level docs — resolve. The remaining features are internal tooling
# (profiling instrumentation, benchmark fixtures) and add no public API.
[package.metadata.docs.rs]
features = ["arrow", "dictionary"]

[lints]
workspace = true
