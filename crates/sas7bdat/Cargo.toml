[package]
name = "sas7bdat"
version = "0.3.0"
edition = "2024"
description = "SIMD-accelerated SAS7BDAT reader with optional Arrow batch output"
license = "MIT"
repository = "https://github.com/tkragholm/sas7bdat-parser-rs"
documentation = "https://docs.rs/sas7bdat"
readme = "README.md"
keywords = ["sas7bdat", "sas", "arrow", "parser", "simd"]
categories = ["parser-implementations", "science", "statistics"]

[dependencies]
arrow-array = { version = "58", optional = true }
arrow-schema = { version = "58", optional = true }
bstr = "1"
bytemuck = { version = "1", features = ["derive"] }
encoding_rs = "0.8"
hotpath = { version = "0.15", features = ["hotpath"], optional = true }
memchr = "2.8"
memmap2 = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simdutf8 = "0.1"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "scan_hotpaths"
harness = false

[[bench]]
name = "compression_matrix"
harness = false

[[bench]]
name = "backend_matrix"
harness = false

[features]
default = []
arrow = ["dep:arrow-array", "dep:arrow-schema"]
hotpath-profile = ["dep:hotpath"]
