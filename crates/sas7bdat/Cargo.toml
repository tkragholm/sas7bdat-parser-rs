[package]
name = "sas7bdat"
version = "0.3.0"
edition = "2024"
description = "SIMD-accelerated SAS7BDAT reader with optional Arrow batch output"
license = "MIT"
repository = "https://github.com/tkragholm/sas7bdat-parser-rs"
documentation = "https://docs.rs/sas7bdat"
readme = "README.md"
keywords = ["sas7bdat", "sas", "arrow", "parser", "simd"]
categories = ["parser-implementations", "science", "statistics"]

[dependencies]
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
bstr = { workspace = true }
bytemuck = { workspace = true }
encoding_rs = { workspace = true }
hotpath = { workspace = true, optional = true }
memchr = { workspace = true }
memmap2 = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
simdutf8 = { workspace = true }
# Optional string-column dictionary encoding (feature = "dictionary").
ahash = { version = "0.8", optional = true }
lasso2 = { version = "0.8", optional = true }
cardinality-estimator = { version = "1", optional = true }

[dev-dependencies]
criterion = { workspace = true }
csv = { workspace = true }

[[example]]
name = "bench_dict"
required-features = ["dictionary"]

[[bench]]
name = "scan_hotpaths"
harness = false

[[bench]]
name = "compression_matrix"
harness = false

[[bench]]
name = "backend_matrix"
harness = false

[[bench]]
name = "wide_table"
harness = false
required-features = ["internal-bench"]

[features]
default = []
arrow = ["dep:arrow-array", "dep:arrow-schema"]
hotpath-profile = ["dep:hotpath"]
# Exposes `test_utils` (synthetic dataset builders) for the `wide_table` benchmark.
internal-bench = []
# String-column dictionary encoding: HLL cardinality gate + lasso2 interner.
dictionary = ["dep:ahash", "dep:lasso2", "dep:cardinality-estimator"]

# Build docs.rs with the `arrow` feature so the Arrow batch API is documented.
# `hotpath-profile` is omitted: it adds internal profiling instrumentation, not public API.
[package.metadata.docs.rs]
features = ["arrow"]

[lints]
workspace = true
