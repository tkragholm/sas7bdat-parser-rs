[package]
name = "sas7bdat"
version = "0.3.0"
edition = "2024"
description = "SIMD-accelerated SAS7BDAT reader with optional Arrow batch output"
license = "MIT"
repository = "https://github.com/tkragholm/sas7bdat-parser-rs"
documentation = "https://docs.rs/sas7bdat"
readme = "README.md"
keywords = ["sas7bdat", "sas", "arrow", "parser", "simd"]
categories = ["parser-implementations", "science", "statistics"]

[dependencies]
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
bstr = { workspace = true }
bytemuck = { workspace = true }
encoding_rs = { workspace = true }
hotpath = { workspace = true, optional = true }
memchr = { workspace = true }
memmap2 = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
simdutf8 = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
csv = { workspace = true }

[[bench]]
name = "scan_hotpaths"
harness = false

[[bench]]
name = "compression_matrix"
harness = false

[[bench]]
name = "backend_matrix"
harness = false

[features]
default = []
arrow = ["dep:arrow-array", "dep:arrow-schema"]
hotpath-profile = ["dep:hotpath"]
