# `x86-64-v3` is AVX2 (256-bit). Verified with `cargo asm` that the SIMD kernels do
# vectorize under it — `is_ascii_simd` becomes `vpor` + `vptest` + branch per 64 bytes,
# and `gather_staged_8byte_le`'s missing-test becomes `vpcmpeqq`/`vpand`.
#
# But both kernels are sized for 512-bit: `Simd<u8, 64>` in scan::string and
# `LANES = 8` u64s in scan::batch are each exactly one AVX-512 zmm register. Under v3
# every one of those is split into two 256-bit halves plus a fold. Rebuilt with
# `x86-64-v4`, `trim_and_classify_for_mode` goes from 19 ymm / 0 zmm to 0 ymm / 8 zmm,
# and `is_ascii_simd`'s inner loop collapses to two instructions per 64 bytes
# (`vptestmd` + `kortestw`).
#
# This file also governs the PyPI wheel builds in .github/workflows/wheels.yml, so it
# must stay at a baseline those wheels can rely on. AVX-512 is absent from every Intel
# consumer part since Alder Lake, and a binary that uses it dies with an illegal
# instruction on such a CPU — at import, with no useful error. v3 (AVX2, 2013) is the
# floor the published artifacts commit to.
#
# The deployment server is a 96-core EPYC (Zen 5), which runs AVX-512 on a full 512-bit
# datapath with no clock penalty. It gets a tuned build via `just build-cli-server`,
# where RUSTFLAGS overrides this section rather than merging with it.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]
