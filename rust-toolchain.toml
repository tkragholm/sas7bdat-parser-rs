# Stable. Only the fuzzing and AddressSanitizer jobs need a nightly, and they
# select one explicitly via RUSTUP_TOOLCHAIN rather than through this file.
#
# Pinned to an exact version rather than floating on `stable`: a new release's
# clippy lints should turn CI red when someone chooses to bump this, not on the
# Thursday Rust ships.
# fearless_simd requires >= 1.89.
[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy"]
