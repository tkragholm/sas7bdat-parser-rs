[workspace]
members = [
    "crates/sas7bdat-cli",
    "crates/sas7bdat",
    "crates/sas7bdat-convert",
    "crates/polars-plugin",
]
# The polars plugin is a PyO3 extension module: a bare `cargo build` links it
# against libpython, which fails on machines without Python dev libs. Keep it
# out of the default set so `cargo build`/`cargo test` Just Work after a clone;
# build it explicitly with `-p sas7bdat-polars` or via maturin (see README).
default-members = [
    "crates/sas7bdat",
    "crates/sas7bdat-convert",
    "crates/sas7bdat-cli",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
arrow-array = "59"
arrow-schema = "59"
bytemuck = { version = "1.4", features = ["derive"] }
bstr = "1"
criterion = "0.8"
clap = { version = "4", features = ["derive"] }
csv = "1"
chrono = { version = "0.4.10", default-features = false, features = ["alloc"] }
encoding_rs = "0.8.11"
glob = "0.3"
hex = "0.4"
hotpath = { version = "0.17", features = ["hotpath"] }
indicatif = "0.18"
memchr = "2.8"
memmap2 = "0.9"
mimalloc = { version = "0.1.49", default-features = false, features = ["secure"] }
num-traits = "0.2"
parquet = { version = "59", features = ["arrow"] }
polars = "0.54"
polars-arrow = "0.54"
polars-plan = { version = "0.54", features = ["serde"] }
# generate-import-lib synthesizes pythonXX.lib so Windows wheels can be cross-compiled without a Windows Python install.
pyo3 = { version = "0.28", features = ["generate-import-lib"] }
# Keep in lockstep with pyo3 — provides the build.rs extension-module linker args.
pyo3-build-config = "0.28"
pyo3-polars = "0.27.0"
rayon = "1"
rmp-serde = "1"
serde = { version = "1.0.130", features = ["derive"] }
serde_json = "1"
simdutf8 = "0.1"
walkdir = "2"
tracing = "0.1.44"
tracing-indicatif = "0.3.14"
tracing-subscriber = "0.3.23"

[workspace.lints.rust]
# This crate parses untrusted files; every `unsafe` must be a deliberate, reviewed
# decision (each existing site carries a SAFETY justification and an explicit allow).
unsafe_code = "warn"

[workspace.lints.clippy]
# priority = -1 so the groups are applied before the per-lint entries below; at equal
# priority cargo warns and the group wins, silently undoing any specific `allow`.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Lints the manifests rather than the code: wildcard dependencies, missing package
# metadata, badly named features.
cargo = { level = "warn", priority = -1 }
# The one member of `cargo` that is pure noise here: every instance is a duplicate
# version deep inside the polars/pyo3 tree (foldhash, getrandom, hashbrown, rand,
# windows-*), which no change on our side can resolve.
multiple_crate_versions = "allow"

[profile.release]
lto = "thin"
codegen-units = 8
opt-level = 3
panic = "abort"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
