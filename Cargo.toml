[workspace]
members = ["crates/sas7bdat-simd", "crates/profiler", "crates/polars_plugin"]
resolver = "2"

[workspace.dependencies]
arrow-array = "58.1.0"
arrow-schema = "58.1.0"
bstr = "1"
criterion = "0.8.2"
csv = "1"
encoding_rs = "0.8"
hotpath = { version = "0.15", features = ["hotpath"] }
memchr = "2.8"
memmap2 = "0.9"
mimalloc = { version = "0.1.48", default-features = false, features = ["secure", "v3"] }
polars = "0.53.0"
polars-arrow = "0.53.0"
polars-plan = { version = "0.53.0", features = ["serde"] }
pyo3 = { version = "0.27" }
pyo3-polars = "0.26.0"
rayon = "1"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1.44"
tracing-indicatif = "0.3.14"
tracing-subscriber = "0.3.23"

[profile.release]
lto = "thin"
codegen-units = 8
opt-level = 3
panic = "abort"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
