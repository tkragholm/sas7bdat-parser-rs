[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "sas7bdat-dir-mapper"
version = "0.1.0"
description = "Tools for mapping out SAS7BDAT files"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Operating System :: Microsoft :: Windows",
]

# pytest walks UP from the tests it is given until it finds a file with this
# table, and takes that directory as rootdir and that table as configuration.
# A checkout nested inside another project's tree would otherwise pick up that
# project's pytest configuration. This table ends the walk at this directory,
# whatever is above it.
[tool.pytest.ini_options]
testpaths = ["crates/polars-plugin/tests"]

[tool.maturin]
bindings = "bin"
manifest-path = "crates/sas7bdat-cli/Cargo.toml"
# maturin has no `--bin` filter: a `bindings = "bin"` build packages every binary
# the cargo build produced. `cargo-extra-args` is not a maturin 1.x key and is
# ignored silently.
# The single binary is selected through the crate's feature gates instead.
no-default-features = true
features = ["dir-mapper"]
