[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "sas7bdat-dir-mapper"
version = "0.1.0"
description = "Tools for mapping out SAS7BDAT files"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Operating System :: Microsoft :: Windows",
]

[tool.maturin]
bindings = "bin"
manifest-path = "crates/sas7bdat-cli/Cargo.toml"
# maturin has no `--bin` filter: a `bindings = "bin"` build packages every binary
# the cargo build produced. (`cargo-extra-args` is not a maturin 1.x key — it was
# accepted silently and ignored, so this wheel used to ship all four binaries.)
# The single binary is selected through the crate's feature gates instead.
no-default-features = true
features = ["dir-mapper"]
