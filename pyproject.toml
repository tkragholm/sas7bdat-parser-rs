[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "sas7bdat-simd-tools"
version = "0.1.0"
description = "Server-friendly binary tools for profiling SAS7BDAT corpora"
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Operating System :: Microsoft :: Windows",
]

[tool.maturin]
bindings = "bin"
